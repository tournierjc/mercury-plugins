paths:
  - scope: __ROOT__/mercury-agent
    read: true
    write: true
    execute: true
  - scope: self
    read: true
    write: true
autoApproveCommands:
  - "node *"
  - "npm test"
  - "npm run *"
  - "npx *"
  - "rg *"
  - "git status *"
  - "git diff *"
  - "git log *"
  - "git show *"
tools:
  deny: [git_push, delete_file]
