<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Defense in depth: the route also sends this as a header, which a meta tag can only tighten. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>OpenUI</title>
<style>
  :root {
    --text: #e8e8e6;
    --muted: #8b98aa;
    --surface: #0f1720;
    --border: #1d2530;
    --accent: #00d4ff;
    --danger: #ff6b6b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  /* The host owns the height, so the frame must never scroll on its own. */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body {
    color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #root { display: block; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .card {
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 60%, transparent);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .card.tone-ok { border-left: 3px solid #3fb950; }
  .card.tone-warn { border-left: 3px solid #d29922; }
  .card.tone-danger { border-left: 3px solid var(--danger); }
  .card-title { font-weight: 600; margin-bottom: 4px; }
  .text { margin: 0; }
  h2.text { font-size: 15px; font-weight: 650; }
  h3.text { font-size: 14px; font-weight: 650; }
  .muted { color: var(--muted); }
  .small { font-size: 11px; }
  .accent { color: var(--accent); }
  .strong { font-weight: 600; }
  .mono { font-family: var(--mono); }
  .unit { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .kv:last-child { border-bottom: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  caption { text-align: left; font-size: 11px; padding-bottom: 6px; }
  th {
    text-align: left; font-weight: 500; color: var(--muted);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    padding: 6px 8px; border-bottom: 1px solid var(--border);
  }
  td { padding: 6px 8px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
  tbody tr:last-child td { border-bottom: 0; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  ul, ol { margin: 0; padding-left: 18px; }
  li { padding: 2px 0; }
  .stat { display: flex; align-items: baseline; gap: 8px; }
  .stat-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-value.tone-ok { color: #3fb950; }
  .stat-value.tone-warn { color: #d29922; }
  .stat-value.tone-danger { color: var(--danger); }
  .code { padding: 0; overflow: hidden; }
  .code-bar { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  /* Code wraps rather than scrolls: in a chat column a clipped command is worse than a
     wrapped one, and a nested scroll area inside a sandboxed frame is a trap. */
  pre { margin: 0; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
  .pending { color: var(--muted); font-family: var(--mono); font-size: 11px; padding: 2px 0; }
</style>
</head>
<body>
<div id="root"><div class="pending">…</div></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
