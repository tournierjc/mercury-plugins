<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenUI Lang v1 — rendu de référence</title>
<style>
  :root {
    --bg: #0d1015;
    --surface: #151a21;
    --surface-2: #1b222b;
    --line: #242c37;
    --text: #e6ebf2;
    --muted: #8b98aa;
    --accent: #4f9cf9;
    --ok: #3fb950;
    --warn: #d29922;
    --danger: #f85149;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 20px 60px;
    background: radial-gradient(1200px 500px at 20% -10%, #17202b 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .face {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(140deg, #2b6cb0, #4f9cf9);
    display: grid; place-items: center; font-weight: 700; font-size: 14px;
  }
  .who .name { font-weight: 650; }
  .who .when { color: var(--muted); font-size: 12px; }
  .prose { margin: 0 0 14px; }
  .openui { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px;
  }
  .card.tone-ok { border-left: 3px solid var(--ok); }
  .card.tone-warn { border-left: 3px solid var(--warn); }
  .card.tone-danger { border-left: 3px solid var(--danger); }
  .card .card-title { font-weight: 650; margin-bottom: 6px; }
  .card .card-body { color: var(--muted); }
  .h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .h2 { font-size: 17px; font-weight: 650; margin: 0; }
  .h3 { font-size: 15px; font-weight: 650; margin: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 13.5px; }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .kv:last-child { border-bottom: 0; }
  .kv .label { color: var(--muted); }
  .kv .value { font-variant-numeric: tabular-nums; }
  .kv.highlight .value { color: var(--accent); font-weight: 650; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  caption { text-align: left; color: var(--muted); font-size: 12px; padding-bottom: 8px; }
  th {
    text-align: left; font-weight: 600; color: var(--muted);
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    padding: 8px 10px; border-bottom: 1px solid var(--line);
  }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:nth-child(even) { background: rgba(255, 255, 255, .018); }
  tbody tr:last-child td { border-bottom: 0; }
  ul, ol { margin: 0; padding-left: 20px; }
  li { padding: 3px 0; }
  .stat { display: flex; align-items: baseline; gap: 10px; }
  .stat .stat-value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .stat-label { color: var(--muted); }
  .stat .stat-delta { font-size: 13px; color: var(--ok); }
  .stat.tone-warn .stat-value { color: var(--warn); }
  .stat.tone-danger .stat-value { color: var(--danger); }
  .code { background: #0a0d12; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .code .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 12px; background: #0e131a; border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 11.5px; font-family: var(--mono);
  }
  .code pre { margin: 0; padding: 13px 14px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.6; }
  .code .k { color: #ff7b72; } .code .s { color: #a5d6ff; } .code .c { color: #6b7a8f; font-style: italic; }
  .chart { padding: 4px 2px 0; }
  .chart .chart-title { font-weight: 600; margin-bottom: 2px; }
  .chart .chart-unit { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .axis { fill: var(--muted); font-size: 10.5px; font-family: var(--mono); }
  .chart .bar { fill: var(--accent); }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
  .footer { margin-top: 26px; color: var(--muted); font-size: 12px; }
  .footer code { font-family: var(--mono); color: var(--text); }
  .fallback {
    background: #0a0d12; border: 1px dashed var(--line); border-radius: 12px;
    padding: 14px; font-family: var(--mono); font-size: 12.5px; color: #b3bfcd; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="who">
    <div class="face">M</div>
    <div>
      <div class="name">Mercury · rendu de référence OpenUI Lang v1</div>
      <div class="when">client web · même sortie modèle, deux implémentations (React / Compose)</div>
    </div>
  </div>
  <p class="prose" id="prose"></p>
  <div class="openui" id="root"></div>
  <div class="footer">
    Rendu à partir du bloc <code>```openui</code> ci-dessous, validé par le plugin
    <code>openui-contract</code> — tableau, code et graphique compris.
  </div>
  <div class="fallback" id="spec"></div>
</div>

<script>
const SPEC = `root = Stack([intro, fleet, latency, snippet, notes])
intro = Text({"text": "État de l'équipe à 12:40", "variant": "h2"})
fleet = Table({"columns": ["Équipier", "État", "Runs", "Dernier passage"], "rows": [["CEO", "attente de vous", "3", "il y a 4 min"], ["Dev", "ok", "12", "il y a 1 h"], ["Recherche", "échec", "1", "il y a 2 h"]], "caption": "Trois équipiers, un seul demande une réponse."})
latency = Chart({"kind": "line", "title": "Latence p95 du daemon", "unit": "ms", "labels": ["09:00", "10:00", "11:00", "12:00"], "values": [180, 245, 210, 165]})
snippet = Code({"language": "bash", "title": "Relancer l'équipier bloqué", "code": "mercury bots dispatch ceo \\"reprends la file\\"\\nmercury bots status ceo"})
notes = List({"ordered": false, "items": ["Latence redescendue après le 3e passage.", "Aucun run en échec depuis 11:20."]})`;

/* --- parse: the same grammar the plugin enforces (layout ids bare, props JSON) --- */
function parseSpec(text) {
  const nodes = new Map();
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line || line.startsWith('//') || line.startsWith('#')) continue;
    const m = /^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*([A-Z][A-Za-z0-9]*)\s*\(([\s\S]*)\)$/.exec(line);
    if (!m) continue;
    const [, id, component, rawArgs] = m;
    let args;
    if (rawArgs.trim().startsWith('[')) {
      args = rawArgs.trim().replace(/^\[|\]$/g, '').split(',').map((s) => s.trim()).filter(Boolean);
    } else {
      try { args = JSON.parse(rawArgs); } catch { args = {}; }
    }
    nodes.set(id, { id, component, args });
  }
  return nodes;
}

/* --- render --- */
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v);
  }
  for (const child of children.flat()) if (child != null) el.append(child);
  return el;
}

function renderNode(id, nodes, seen = new Set()) {
  const node = nodes.get(id);
  if (!node || seen.has(id)) return null;
  seen.add(id);
  const a = node.args || {};
  switch (node.component) {
    case 'Stack':
      return h('div', { class: 'openui' }, a.map((child) => renderNode(child, nodes, new Set(seen))));
    case 'Text': {
      const variant = a.variant || 'body';
      const cls = variant === 'mono' ? 'mono' : variant;
      return h('p', { class: `${cls}${a.muted ? ' muted' : ''}`, text: a.text || '' });
    }
    case 'Card': {
      const tone = a.tone && a.tone !== 'neutral' ? ` tone-${a.tone}` : '';
      return h('div', { class: `card${tone}` },
        a.title ? h('div', { class: 'card-title', text: a.title }) : null,
        a.body ? h('div', { class: 'card-body', text: a.body }) : null);
    }
    case 'KeyValue':
      return h('div', { class: `kv${a.highlight ? ' highlight' : ''}` },
        h('span', { class: 'label', text: a.label || '' }),
        h('span', { class: 'value', text: a.value || '' }));
    case 'Table': {
      const rows = a.rows || [];
      const columns = a.columns || [];
      // A column of numbers reads better right-aligned; the rule is the data, not a guess
      // about the header ("Runs" may hold "3" or "3 runs", and only the first is a number).
      const numeric = columns.map((_, index) =>
        rows.length > 0 && rows.every((row) => /^-?\d+([.,]\d+)?$/.test(String(row[index] ?? '').trim())));
      const table = h('table', {},
        a.caption ? h('caption', { text: a.caption }) : null,
        h('thead', {}, h('tr', {}, columns.map((c, i) => h('th', { class: numeric[i] ? 'num' : '', text: c })))),
        h('tbody', {}, rows.map((row) => h('tr', {}, row.map((cell, i) => h('td', { class: numeric[i] ? 'num' : '', text: cell }))))));
      return h('div', { class: 'card' }, table);
    }
    case 'List': {
      const tag = a.ordered ? 'ol' : 'ul';
      return h('div', { class: 'card' }, h(tag, {}, (a.items || []).map((item) => h('li', { text: item }))));
    }
    case 'Stat':
      return h('div', { class: `card` },
        h('div', { class: `stat${a.tone && a.tone !== 'neutral' ? ` tone-${a.tone}` : ''}` },
          h('span', { class: 'stat-value', text: a.value || '' }),
          a.delta ? h('span', { class: 'stat-delta', text: a.delta }) : null),
        h('div', { class: 'stat-label', text: a.label || '' }));
    case 'Code':
      return h('div', { class: 'code' },
        h('div', { class: 'bar' },
          h('span', { text: a.title || '' }),
          h('span', { text: a.language || 'text' })),
        h('pre', {}, highlight(a.code || '', a.language)));
    case 'Chart':
      return chart(a);
    default:
      return h('div', { class: 'fallback', text: `${node.component} n'est pas rendu par ce client (v1)` });
  }
}

/** Enough colour to read a snippet: comments, strings, keywords. */
function highlight(code, language) {
  const frag = document.createDocumentFragment();
  const pattern = /(#[^\n]*|\/\/[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(if|then|else|for|in|do|done|while|def|return|const|let|echo|mercury|bots|status|dispatch)\b/g;
  let last = 0;
  let m;
  while ((m = pattern.exec(code)) !== null) {
    if (m.index > last) frag.append(document.createTextNode(code.slice(last, m.index)));
    const cls = m[1] ? 'c' : m[2] ? 's' : 'k';
    frag.append(h('span', { class: cls, text: m[0] }));
    last = m.index + m[0].length;
  }
  frag.append(document.createTextNode(code.slice(last)));
  return frag;
}

/** Round tick steps (1, 2, 5 × 10^k): 0/2/4/6/8, never 0/2/5/7/9. */
function niceStep(raw) {
  const power = Math.pow(10, Math.floor(Math.log10(raw)));
  const fraction = raw / power;
  const nice = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
  return nice * power;
}

function chart(a) {
  const width = 680;
  const height = 190;
  const pad = { t: 14, r: 14, b: 28, l: 54 };
  const values = (a.values || []).map(Number);
  const labels = a.labels || [];
  const dataMax = Math.max(...values, 1);
  // A chart of counts starts at zero; a chart of latencies does not have to.
  const step = niceStep(Math.max((dataMax - Math.min(...values, 0)) / 4, 1));
  const max = Math.ceil(dataMax / step) * step;
  const min = 0;
  const span = max - min || 1;
  const x = (i) => pad.l + (i * (width - pad.l - pad.r)) / Math.max(values.length - 1, 1);
  const y = (v) => pad.t + (1 - (v - min) / span) * (height - pad.t - pad.b);

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', a.title || 'graphique');

  const ns = (tag, attrs, text) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (text != null) el.textContent = text;
    return el;
  };

  for (let value = min; value <= max + 1e-9; value += step) {
    const gy = y(value);
    svg.append(ns('line', { class: 'grid', x1: pad.l, x2: width - pad.r, y1: gy, y2: gy }));
    svg.append(ns('text', { class: 'axis', x: pad.l - 10, y: gy + 3.5, 'text-anchor': 'end' }, String(Math.round(value))));
  }
  labels.forEach((label, i) => {
    const cx = a.kind === 'bar' && values.length > 1
      ? pad.l + ((width - pad.l - pad.r) / values.length) * (i + 0.5)
      : x(i);
    svg.append(ns('text', { class: 'axis', x: cx, y: height - 9, 'text-anchor': 'middle' }, label));
  });

  if (a.kind === 'bar') {
    const slot = (width - pad.l - pad.r) / Math.max(values.length, 1);
    const barWidth = Math.min(38, slot * 0.55);
    values.forEach((v, i) => {
      // Centre each bar on its slot, not on the point: the first bar must not reach
      // into the axis labels, which is what made the `0` tick look clipped.
      const cx = values.length === 1 ? (pad.l + width - pad.r) / 2 : pad.l + slot * (i + 0.5);
      svg.append(ns('rect', {
        class: 'bar', x: cx - barWidth / 2, y: y(v), width: barWidth,
        height: Math.max(1, height - pad.b - y(v)), rx: 4,
      }));
    });
  } else {
    const points = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
    svg.append(ns('polyline', { class: 'line', points }));
    values.forEach((v, i) => svg.append(ns('circle', { class: 'dot', cx: x(i), cy: y(v), r: 3.5 })));
  }

  return h('div', { class: 'card' },
    h('div', { class: 'chart' },
      a.title ? h('div', { class: 'chart-title', text: a.title }) : null,
      a.unit ? h('div', { class: 'chart-unit', text: `en ${a.unit}` }) : null,
      svg));
}

/* --- boot: one answer = prose + one spec. `?spec=<base64url>` renders a captured answer --- */
const fromUrl = new URLSearchParams(location.search).get('spec');
const ACTIVE_SPEC = fromUrl
  ? new TextDecoder().decode(Uint8Array.from(atob(fromUrl.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0)))
  : SPEC;
if (fromUrl) {
  document.querySelector('.who .when').textContent =
    "client web · spec produite par qwen3.8-flash-next sur le rig, validée par openui-contract__render_ui";
}
document.getElementById('prose').textContent =
  "Voici l'état de l'équipe. Le CEO attend une réponse depuis 4 minutes — c'est le seul point qui demande ton attention.";
document.getElementById('spec').textContent = ACTIVE_SPEC;
const nodes = parseSpec(ACTIVE_SPEC);
const rendered = renderNode('root', nodes);
if (rendered) document.getElementById('root').replaceWith(rendered);
</script>
</body>
</html>
