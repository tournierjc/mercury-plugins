<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Diff</title>
<style>
  :root {
    --text: #e8e8e6;
    --muted: #8b98aa;
    --surface: #0f1720;
    --border: #1d2530;
    --add: #3fb950;
    --del: #ff6b6b;
    --hunk: #58a6ff;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  /* The host owns the height, so the frame must never scroll on its own: a stale scrollTop
     after a resize shows the empty area under the content. */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { color: var(--text); font: 12px/1.55 var(--mono); -webkit-font-smoothing: antialiased; }
  .card { border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 60%, transparent); border-radius: 10px; overflow: hidden; }
  .bar { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px; }
  .lines { padding: 8px 0; }
  .line { display: flex; gap: 8px; padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .sign { width: 10px; color: var(--muted); flex: none; }
  .add { color: var(--add); background: color-mix(in srgb, var(--add) 8%, transparent); }
  .del { color: var(--del); background: color-mix(in srgb, var(--del) 8%, transparent); }
  .hunk { color: var(--hunk); }
  .meta { color: var(--muted); }
  .pending { color: var(--muted); font-size: 11px; padding: 2px 0; }
</style>
</head>
<body>
<div id="root"><div class="pending">…</div></div>
<script>
(function () {
  var HOST = window.parent;
  var last = '';
  var lastWidth = 0;
  var lastPayload = null;

  function report() {
    HOST.postMessage({ v: 1, type: 'height', px: Math.ceil(document.body.getBoundingClientRect().height) + 2 }, '*');
  }

  function render(payload) {
    var text = payload.text || '';
    // A width change rewraps the patch: redraw rather than keep a stale measurement.
    var widthChanged = document.body.clientWidth !== lastWidth;
    if (text === last && !widthChanged) return;
    last = text;
    lastPayload = payload;
    lastWidth = document.body.clientWidth;
    var theme = payload.theme || {};
    if (theme.text) document.documentElement.style.setProperty('--text', theme.text);
    if (theme.muted) document.documentElement.style.setProperty('--muted', theme.muted);
    if (theme.surface) document.documentElement.style.setProperty('--surface', theme.surface);
    if (theme.border) document.documentElement.style.setProperty('--border', theme.border);
    if (theme.mono) document.body.style.fontFamily = theme.mono;

    var root = document.getElementById('root');
    root.replaceChildren();

    var lines = text.replace(/\n$/, '').split('\n');
    var added = 0, removed = 0;
    var body = document.createElement('div');
    body.className = 'lines';

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var kind = line.indexOf('+++') === 0 || line.indexOf('---') === 0 || line.indexOf('diff ') === 0 || line.indexOf('index ') === 0
        ? 'meta'
        : line.indexOf('+') === 0 ? 'add'
        : line.indexOf('-') === 0 ? 'del'
        : line.indexOf('@@') === 0 ? 'hunk'
        : '';
      if (kind === 'add') added++;
      if (kind === 'del') removed++;

      var row = document.createElement('div');
      row.className = 'line ' + kind;
      var sign = document.createElement('span');
      sign.className = 'sign';
      sign.textContent = kind === 'add' ? '+' : kind === 'del' ? '−' : '';
      var code = document.createElement('span');
      code.textContent = kind === 'add' || kind === 'del' ? line.slice(1) : line;
      row.append(sign, code);
      body.append(row);
    }

    var card = document.createElement('div');
    card.className = 'card';
    var bar = document.createElement('div');
    bar.className = 'bar';
    var title = document.createElement('span');
    title.textContent = 'diff';
    var stats = document.createElement('span');
    stats.textContent = '+' + added + '  −' + removed;
    bar.append(title, stats);
    card.append(bar, body);
    root.append(card);
    window.scrollTo(0, 0);
    report();
  }

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || data.v !== 1 || data.type !== 'render') return;
    render(data);
  });

  // Measure once more after layout settles: a single synchronous read under-reports when
  // the frame was still being sized by the host, which clips the last line.
  new ResizeObserver(function () {
    if (lastPayload && document.body.clientWidth !== lastWidth) return render(lastPayload);
    report();
  }).observe(document.body);
  requestAnimationFrame(report);
  HOST.postMessage({ v: 1, type: 'ready' }, '*');
})();
</script>
</body>
</html>
